[package]
name = "stick-gateway"
version = "0.1.0"
edition = "2021"
description = "Local cloud for a WAAREE/FoxESS Wi-Fi stick: TLS on tcp/14431, decodes its records, pushes them to the dashboard Worker"
license = "GPL-3.0-only"

[[bin]]
name = "stick-gateway"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "fs", "sync", "signal", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argh = "0.1"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Same size-first profile as waaree-dash: the AP has ~100 MB of flash.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "io-util"] }
